<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Wave</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section -->
    <!-- Header -->
    <header class="header">
        <div class="container nav-container">
            <a href="#" class="logo">
                 Tech<span class="text-gradient">Wave</span>
            </a>

            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#episodes" class="nav-link">Episodes</a></li>
                    <li><a href="#host" class="nav-link">Host</a></li>
                </ul>
            </nav>
        <div class="header-right">
            <button class="btn-primary btn nav-btn">Subscribe</button>
        </div>
        <div class="hamburger-menu">
            <img src="./assets/hamburger-menu.png" alt="hamburger-menu">
        </div>
    </header>
     <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="container hero-container">
                <!-- Podcast Circle -->
                <div class="podcast-circle-wrapper">
                    <div class="podcast-circle">
                        <img src="./assets/microphone.png" alt="Microphone" class="mic-icon">
                    </div>
                    <div class="new-badge">New</div>
                    <div class="wave-effect"></div>
                </div>

                <!-- Text Content -->
                <div class="hero-content">
                    <h1 class="hero-title">TechWave</h1>
                    <p class="hero-subtitle">
                       Your daily dose of tech insights, productivity hacks, and personal growth
                    </p>

                    <div class="hero-buttons">
                        <a href="#listen" class="btn btn-primary">
                            <i class="fa-brands fa-spotify"></i>Listen on Spotify
                        </a>
                        <a href="#subscribe" class="btn btn-outline">
                            <i class="fas fa-rss"></i>Subscribe
                        </a>
                    </div>
                </div>
            </div>
        </section>



</body>
</html>
